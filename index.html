<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="고요" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>고요</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <section id="screen-home" class="screen active" data-screen="home">
        <div class="home-bg" id="home-bg"></div>
        <div class="home-veil"></div>
        <div class="home-main">
          <header class="home-top">
            <p class="home-date" id="home-date"></p>
            <h1 class="home-greeting" id="home-greeting">좋은 저녁입니다.</h1>
          </header>

          <div class="home-hero">
            <div class="home-cats">
              <p class="kicker">오늘의 명상</p>
              <div class="duration-row" role="group" aria-label="명상 시간">
                <button type="button" class="chip" data-minutes="5">5분</button>
                <button type="button" class="chip selected" data-minutes="10">10분</button>
                <button type="button" class="chip" data-minutes="15">15분</button>
              </div>
            </div>

            <div class="home-center">
              <p class="home-copy">마음을 잠시 내려놓으세요</p>
              <button type="button" class="primary-btn" id="btn-start">명상 시작하기</button>
              <p class="streak-line" id="home-streak">연속 기록을 시작해 보세요</p>
            </div>
          </div>
        </div>

        <div class="home-side">
          <section class="track-picker">
            <p class="music-label">음악 선택 · 시간에 맞는 영상을 재생합니다</p>
            <div class="track-list" id="track-list"></div>
          </section>

          <aside class="install-card hidden" id="install-card">
            <div>
              <strong>앱으로 사용하기</strong>
              <p id="install-hint" class="hidden">공유 버튼에서 ‘홈 화면에 추가’를 눌러 설치하세요.</p>
            </div>
            <button type="button" class="install-btn" id="btn-install">설치</button>
            <button type="button" class="dismiss-btn" id="btn-dismiss-install" aria-label="닫기">×</button>
          </aside>
        </div>
      </section>

      <section id="screen-session" class="screen" data-screen="session">
        <div class="session-bg" id="session-bg"></div>
        <div class="session-veil"></div>
        <button type="button" class="back-btn" id="btn-back">← 뒤로</button>
        <div class="session-ui">
          <p class="session-title" id="session-title"></p>
          <p class="session-timer" id="session-timer">10:00</p>
          <button type="button" class="ghost-btn" id="btn-pause">명상 일시정지</button>
          <button type="button" class="text-btn" id="btn-end">명상 종료하기</button>
        </div>
        <div id="yt-wrap" class="yt-wrap">
          <iframe
            id="yt-frame"
            class="yt-frame"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
            title="명상 음악"
          ></iframe>
        </div>
        <div class="session-done hidden" id="session-done">
          <p class="done-kicker">완료</p>
          <h2>오늘도 잘 머물렀습니다</h2>
          <p id="done-summary"></p>
          <button type="button" class="primary-btn" id="btn-done-home">홈으로</button>
        </div>
      </section>

      <section id="screen-calendar" class="screen screen-plain" data-screen="calendar">
        <header class="plain-header">
          <h1>나의 명상 기록</h1>
        </header>
        <div class="calendar-layout">
          <div class="calendar-board">
            <div class="month-nav">
              <button type="button" class="icon-btn" id="btn-prev-month" aria-label="이전 달">‹</button>
              <p id="calendar-month"></p>
              <button type="button" class="icon-btn" id="btn-next-month" aria-label="다음 달">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </div>
          <aside class="calendar-aside">
            <p class="streak-line calendar-streak" id="calendar-streak"></p>
            <div class="month-stats">
              <div>
                <strong id="month-count">0</strong>
                <span>이번 달 명상</span>
              </div>
              <div>
                <strong id="month-minutes">0분</strong>
                <span>총 시간</span>
              </div>
            </div>
            <article class="day-detail" id="day-detail">
              <p>날짜를 선택하면 기록이 나타납니다.</p>
            </article>
          </aside>
        </div>
      </section>

      <section id="screen-challenge" class="screen screen-plain" data-screen="challenge">
        <div class="challenge-panel">
          <header class="plain-header">
            <h1>7일 명상 챌린지</h1>
            <p class="plain-sub">매일 5분 이상 명상하기</p>
          </header>
          <p class="challenge-ratio" id="challenge-ratio">0 / 7일</p>
          <div class="challenge-dots" id="challenge-dots"></div>
          <p class="streak-line" id="challenge-streak"></p>
          <button type="button" class="primary-btn" id="btn-challenge-home">오늘 명상하기</button>
        </div>
      </section>

      <nav class="tab-bar" id="tab-bar">
        <p class="brand">고요</p>
        <button type="button" class="tab active" data-tab="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" fill="currentColor"/></svg>
          홈
        </button>
        <button type="button" class="tab" data-tab="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2V3h-2v2H9V3H7Zm12 8H5v8h14v-8Z" fill="currentColor"/></svg>
          기록
        </button>
        <button type="button" class="tab" data-tab="challenge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s3 4 3 7a3 3 0 1 1-6 0c0-3 3-7 3-7Zm-1.2 12.2c-2.6 1.2-4.3 3.4-4.8 6.3h12c-.5-3-2.2-5.1-4.8-6.3A4.4 4.4 0 0 1 12 16a4.4 4.4 0 0 1-1.2-1.8Z" fill="currentColor"/></svg>
          챌린지
        </button>
      </nav>
    </div>

    <div class="modal hidden" id="confirm-end">
      <div class="modal-card">
        <p>지금 종료하면 이번 명상은 기록되지 않습니다.</p>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="btn-cancel-end">계속하기</button>
          <button type="button" class="text-btn" id="btn-confirm-end">종료하기</button>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
